x-vivado-environment: &vivado-environment
  REUID: "${UID:-1000}"
  REGID: "${GID:-1000}"
  _JAVA_AWT_WM_NONREPARENTING: "1"
  LD_PRELOAD: "/lib/x86_64-linux-gnu/libudev.so.1"

x-vivado-home-volume: &vivado-home-volume ./home:/home/vivado
x-vivado-work-volume: &vivado-work-volume work:/home/vivado/work

x-vivado: &vivado
  image: vivado:v2025.1
  network_mode: host
  environment: *vivado-environment

services:
  vivado:
    <<: *vivado
    profiles: [local]

    #tty: true
    #stdin_open: true
    working_dir: /home/vivado
    environment:
      <<: *vivado-environment
      DISPLAY: "${DISPLAY}"
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - *vivado-home-volume
      - *vivado-work-volume
    # unset entrypoint
    entrypoint: []
    command:
      - "/bin/bash"
      - "-lc"
      - |
        echo "dash dash/sh boolean false" | debconf-set-selections
        DEBIAN_FRONTEND=noninteractive dpkg-reconfigure dash
        /entrypoint.sh /bin/bash -c ". /opt/Xilinx/2025.1/Vivado/settings64.sh && vivado"

  vivado-remote:
    <<: *vivado
    profiles: [remote]
    volumes:
      - *vivado-home-volume
      - *vivado-work-volume
      - ./sshd_config:/sshd_config:ro
    command: >
      sh -c "
        mkdir -p /home/vivado/.ssh/etc/ssh;
        [ ! -e /home/vivado/.ssh/ssh_host_rsa_key ] && ssh-keygen -t rsa -N '' -f /home/vivado/.ssh/ssh_host_rsa_key;
        /usr/sbin/sshd -D -f /sshd_config
      "

  vivado-remote-gui:
    <<: *vivado
    profiles: [remote-gui]
    environment:
      <<: *vivado-environment
      DISPLAY: "${DISPLAY}"
    volumes:
      - *vivado-home-volume
      - *vivado-work-volume
      - type: bind
        source: ${XAUTHORITY:-${HOME}/.Xauthority}
        target: /tmp/.host.Xauthority
        read_only: true
        bind:
          create_host_path: false
    command:
      - /bin/bash
      - -lc
      - |
        cookie="$$(xauth -f /tmp/.host.Xauthority nlist "$$DISPLAY")"
        if [ -z "$$cookie" ]; then
          echo "No X11 cookie found for DISPLAY=$$DISPLAY" >&2
          exit 1
        fi
        printf '%s\n' "$$cookie" | sed -e 's/^..../ffff/' \
          | xauth -f /tmp/.container.Xauthority nmerge -
        export XAUTHORITY=/tmp/.container.Xauthority
        . /opt/Xilinx/2025.1/Vivado/settings64.sh
        exec vivado

  nfs-server:
    network_mode: host
    image: erichough/nfs-server
    cap_add:
      - SYS_ADMIN
    environment:
      - NFS_EXPORT_0=/exports 100.64.0.0/10(rw,sync,no_subtree_check,no_root_squash,fsid=0)
    volumes:
      - ${WORK_DIR:-./work}:/exports
    #ports:
    #  - "2049:2049"

volumes:
  work:
    driver: local
    driver_opts:
      type: ${PROJECTS_VOL_TYPE:-none}
      o: ${PROJECTS_VOL_OPTS:-bind}
      device: ${PROJECTS_VOL_DEVICE:-${WORK_DIR:-./projects}}
